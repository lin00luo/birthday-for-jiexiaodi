<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 宋文杰 · 20岁生日快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b0b1a;
            font-family: 'Arial', 'PingFang SC', 'Helvetica Neue', sans-serif;
            touch-action: manipulation;
        }

        #cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #cover.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #cover img {
            width: min(300px, 60vw);
            height: auto;
            display: block;
            image-rendering: pixelated;
            transition: transform 0.2s;
        }
        #cover img:active {
            transform: scale(0.92);
        }

        #bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            will-change: opacity;
        }
        .bg-slide.active {
            opacity: 1;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 10px 0;
        }

        .title {
            color: #ffe6a7;
            font-size: clamp(2rem, 8vw, 3.2rem);
            font-weight: 900;
            text-shadow: 0 0 20px #ff9a9e, 0 0 60px #fecfef, 0 0 100px #a18cd1;
            z-index: 10;
            animation: flicker 2.4s infinite alternate;
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        @keyframes flicker {
            0% { opacity: 0.75; text-shadow: 0 0 15px #ff9a9e, 0 0 40px #fecfef; }
            100% { opacity: 1; text-shadow: 0 0 30px #ff9a9e, 0 0 70px #fecfef, 0 0 120px #a18cd1; }
        }

        .sub-title {
            color: rgba(255,255,255,0.9);
            font-size: clamp(1rem, 3.5vw, 1.5rem);
            letter-spacing: 4px;
            z-index: 10;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.08);
            padding: 6px 28px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            font-weight: 300;
        }
        .sub-title .highlight { font-weight: 700; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.4); }
        .sub-title .age { color: #ff9ff3; font-weight: 600; }
        .sub-title .hobby { color: #54a0ff; font-weight: 600; }

        .blessing-carousel {
            color: rgba(255,255,255,0.75);
            font-size: clamp(0.85rem, 2.8vw, 1.2rem);
            z-index: 10;
            margin-bottom: 12px;
            height: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.25);
            padding: 0 24px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
            font-weight: 300;
            letter-spacing: 1px;
            max-width: 85%;
        }
        .blessing-carousel span {
            display: inline-block;
            animation: fadeSlide 0.6s ease;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 蛋糕容器 —— 大幅下移 ===== */
        .cake-wrapper {
            width: min(280px, 70vw);
            height: min(280px, 70vw);
            z-index: 10;
            margin: 50px 0 10px 0;  /* 上边距从 20px 增加到 50px，进一步下移 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .cake-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
            z-index: 10;
        }
        .btn-boom, .btn-video {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: clamp(0.9rem, 2.8vw, 1.1rem);
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            z-index: 10;
            transition: all 0.15s;
            touch-action: manipulation;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.15);
            position: relative;
            overflow: hidden;
        }
        .btn-boom {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        .btn-video {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }
        .btn-boom:active, .btn-video:active {
            transform: scale(0.92);
        }

        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
            margin-top: 12px;
            z-index: 10;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.2);
            padding: 4px 18px;
            border-radius: 20px;
            font-weight: 300;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(10,8,30,0.92);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 36px 32px 28px;
            border-radius: 32px;
            border: 2px solid rgba(255,215,0,0.4);
            box-shadow: 0 0 120px rgba(255,215,0,0.15);
            z-index: 100;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.4s;
            max-width: 88%;
            width: 380px;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .toast .emoji-big {
            font-size: 3.6rem;
            display: block;
            margin-bottom: 6px;
        }
        .toast .msg {
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 700;
            line-height: 1.5;
            background: linear-gradient(135deg, #ffd700, #ff6b6b, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .toast .sub-msg {
            font-size: clamp(0.85rem, 2.8vw, 1.1rem);
            color: rgba(255,255,255,0.7);
            margin-top: 8px;
            font-weight: 300;
            letter-spacing: 1px;
            -webkit-text-fill-color: rgba(255,255,255,0.7);
        }
        .toast .close-btn {
            margin-top: 18px;
            padding: 10px 36px;
            background: linear-gradient(135deg, #ffd700, #f9a825);
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 24px rgba(255,215,0,0.3);
        }
        .toast .close-btn:active {
            transform: scale(0.92);
        }

        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .video-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .video-modal .video-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255,215,0,0.2);
        }
        .video-modal video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
        .video-modal .video-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
        }
        .video-modal .video-controls button {
            padding: 6px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .video-modal .video-controls button:active {
            background: rgba(255,255,255,0.2);
        }
        .video-modal .close-video {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .video-modal .close-video:active {
            background: rgba(255,255,255,0.2);
        }

        .audio-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.6);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .audio-toggle:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.15);
        }
        .audio-toggle .icon { line-height: 1; }

        @media (max-width: 400px) {
            .cake-wrapper {
                width: min(220px, 68vw);
                height: min(220px, 68vw);
                margin-top: 60px;  /* 小屏设备下也下移更多 */
            }
            .btn-group {
                gap: 8px;
            }
            .btn-boom, .btn-video {
                padding: 10px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div id="cover">
        <img src="minecraft_cake.png" alt="Minecraft Cake" id="coverCake">
    </div>

    <div id="bg-slider"></div>
    <div class="stars" id="stars"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="toast" id="toast">
        <span class="emoji-big">🎉</span>
        <div class="msg">生日快乐！</div>
        <div class="sub-msg" id="toastSubMsg">恭喜道友筑基成功，寿元绵长 🧘</div>
        <button class="close-btn" id="closeToastBtn">❤️ 收下祝福</button>
    </div>

    <div class="video-modal" id="videoModal">
        <div class="video-container">
            <button class="close-video" id="closeVideoBtn">✕</button>
            <video id="videoPlayer" controls playsinline>
                <source src="" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
            <div class="video-controls" id="videoControls"></div>
        </div>
    </div>

    <div class="content" id="mainContent">
        <div class="title">🎂 HAPPY BIRTHDAY</div>
        <div class="sub-title" id="subTitle"></div>
        <div class="blessing-carousel" id="blessingCarousel">
            <span>✨ 愿道友大道可期，道心永固 ✨</span>
        </div>
        <div class="cake-wrapper" id="cakeWrapper">
            <img src="minecraft_cake.png" alt="Minecraft Cake" id="mainCake">
        </div>
        <div class="btn-group">
            <button class="btn-boom" id="boomBtn">🎈 戳我许愿</button>
            <button class="btn-video" id="videoBtn">🎬 视频彩蛋</button>
        </div>
        <div class="hint">👆 点击蛋糕进入 · 点击许愿</div>
    </div>

    <div class="audio-toggle" id="audioToggle" title="播放/暂停《不凡》">
        <span class="icon">🔇</span>
    </div>

    <script>
        // ================================================================
        //  ★ 配置区 —— 修改以下内容 ★
        // ================================================================

        const BG_IMAGES = [
            'bg1.jpg',
            'bg2.jpg',
            'bg3.jpg',
            'bg4.jpg',
            'bg5.jpg'
        ];

        const MUSIC_FILE = 'bufan.mp3';
        const CAKE_IMAGE = 'minecraft_cake.png';

        // ★★★ 视频配置 ★★★
        const VIDEOS = [
            { name: '🎞️ 回忆片段1', src: 'video1.mp4' },
            { name: '🎞️ 回忆片段2', src: 'video2.mp4' },
        ];

        // ================================================================
        //  以下代码自动运行，一般不需要修改
        // ================================================================

        // ---- 背景轮播 ----
        (function initBgSlider() {
            if (BG_IMAGES.length === 0) return;
            const container = document.getElementById('bg-slider');
            const slides = [];
            BG_IMAGES.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'bg-slide' + (index === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${url}')`;
                container.appendChild(div);
                slides.push(div);
            });
            let current = 0;
            setInterval(() => {
                slides[current].classList.remove('active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('active');
            }, 5000);
        })();

        // ---- 副标题等 ----
        const CONFIG = {
            friendName: '宋文杰',
            age: 20,
            hobby: '到了20岁了就要拿出真本事',
            blessings: [
                '✨ 愿道友大道可期，道心永固 ✨',
                '🌟 祝修仙之路顺遂，金丹早日结成 🌟',
                '🎈 愿灵根充盈，法力无边 🎈',
                '🌈 愿渡劫成功，飞升可期 🌈',
                '💫 愿法宝相伴，机缘不断 💫',
                '🌺 愿大道至简，心若明镜 🌺',
            ],
            toastMessages: [
                '恭喜道友筑基成功，寿元绵长 🧘',
                '愿道友道心坚定，直指大道 ⚔️',
                '愿灵光常伴，境界突破 🌟',
                '道友，且听风吟，且行且修 🍃',
            ],
        };

        document.getElementById('subTitle').innerHTML = `
            FOR <span class="highlight">${CONFIG.friendName}</span>
            · <span class="age">${CONFIG.age}岁</span>
            · <span class="hobby">${CONFIG.hobby}</span>
        `;

        // ---- 星星 ----
        (function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1.5 + Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                container.appendChild(star);
            }
        })();

        // ---- Canvas 粒子 ----
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const COLORS = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#ff9f43','#00d2d3','#ff4757','#2ed573'];

        class Particle {
            constructor() { this.reset(); this.x = Math.random()*width; this.y = Math.random()*height; }
            reset() {
                this.x = Math.random()*width;
                this.y = -20 - Math.random()*120;
                this.size = 7 + Math.random()*20;
                this.speedY = 0.3 + Math.random()*1.0;
                this.speedX = (Math.random()-0.5)*0.4;
                this.color = COLORS[Math.floor(Math.random()*COLORS.length)];
                this.shape = Math.random()>0.45 ? 'balloon' : 'star';
                this.phase = Math.random()*Math.PI*2;
                this.rotation = 0;
                this.rotSpeed = (Math.random()-0.5)*0.025;
                this.shadowBlur = 12 + Math.random()*10;
                this.exploding = false;
                this.explodeVx = 0;
                this.explodeVy = 0;
                this.gravity = 0.04;
                this.damping = 0.995;
            }
            update() {
                if (this.exploding) {
                    this.x += this.explodeVx;
                    this.y += this.explodeVy;
                    this.explodeVy += this.gravity;
                    this.explodeVx *= this.damping;
                    this.rotation += 0.08;
                    this.size *= 0.997;
                    if (this.size < 0.8 || this.y > height+50) {
                        this.exploding = false;
                        this.reset();
                        this.y = Math.random()*height*0.3;
                    }
                    return;
                }
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.phase)*0.25;
                this.phase += 0.018;
                this.rotation += this.rotSpeed;
                if (this.x > width+30) this.x = -30;
                if (this.x < -30) this.x = width+30;
                if (this.y > height+50) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = this.shadowBlur * (this.exploding ? 1.5 : 1);
                const s = this.size;
                if (this.shape === 'balloon') {
                    const w = s*0.6, h = s*0.7;
                    ctx.beginPath();
                    ctx.ellipse(0,0,w,h,0,0,Math.PI*2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.ellipse(-w*0.25, -h*0.25, w*0.2, h*0.2, -0.5, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(0,h);
                    ctx.quadraticCurveTo(-3,h+6,0,h+10);
                    ctx.quadraticCurveTo(3,h+6,0,h);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                } else {
                    ctx.shadowBlur = this.shadowBlur * 1.4;
                    ctx.fillStyle = this.color;
                    const r = s/2.2;
                    ctx.beginPath();
                    for (let i=0; i<5; i++) {
                        const angle = (i*4*Math.PI/5) - Math.PI/2;
                        const px = Math.cos(angle)*r;
                        const py = Math.sin(angle)*r;
                        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(-r*0.2, -r*0.2, r*0.15, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fill();
                }
                ctx.restore();
            }
            explode(cx, cy, power) {
                const angle = Math.atan2(this.y-cy, this.x-cx) + (Math.random()-0.5)*0.6;
                const speed = 1.5 + Math.random()*power*0.8;
                this.exploding = true;
                this.explodeVx = Math.cos(angle)*speed;
                this.explodeVy = Math.sin(angle)*speed - 0.5;
                this.size = this.size*(0.6+Math.random()*0.8);
                this.color = COLORS[Math.floor(Math.random()*COLORS.length)];
                this.shape = Math.random()>0.3 ? 'star' : 'balloon';
                this.shadowBlur = 25 + Math.random()*20;
            }
        }

        const particles = [];
        for (let i=0; i<160; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0,0,width,height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ---- 祝福语轮播 ----
        const carouselEl = document.getElementById('blessingCarousel');
        let blessingIndex = 0;
        function nextBlessing() {
            blessingIndex = (blessingIndex+1) % CONFIG.blessings.length;
            carouselEl.innerHTML = `<span>${CONFIG.blessings[blessingIndex]}</span>`;
        }
        setInterval(nextBlessing, 4000);

        // ---- 烟花 + 弹窗 ----
        const boomBtn = document.getElementById('boomBtn');
        const toast = document.getElementById('toast');
        const toastSubMsg = document.getElementById('toastSubMsg');
        const closeToastBtn = document.getElementById('closeToastBtn');

        function triggerExplosion() {
            const cx = width/2, cy = height/2, power = 6 + Math.random()*4;
            particles.forEach(p => { if(Math.random()<0.75) p.explode(cx+(Math.random()-0.5)*120, cy+(Math.random()-0.5)*120, power); });
            for (let i=0; i<30; i++) {
                const p = new Particle();
                p.x = cx+(Math.random()-0.5)*80;
                p.y = cy+(Math.random()-0.5)*80;
                p.explode(cx,cy,power*0.8);
                p.size = 4+Math.random()*14;
                p.color = COLORS[Math.floor(Math.random()*COLORS.length)];
                p.shape = Math.random()>0.3 ? 'star' : 'balloon';
                p.shadowBlur = 30;
                particles.push(p);
            }
            const msgs = CONFIG.toastMessages;
            toastSubMsg.textContent = msgs[Math.floor(Math.random()*msgs.length)];
            toast.classList.add('show');
            if (navigator.vibrate) navigator.vibrate(40);
        }

        boomBtn.addEventListener('click', triggerExplosion);

        function closeToastFn() { toast.classList.remove('show'); if(navigator.vibrate) navigator.vibrate(10); }
        closeToastBtn.addEventListener('click', closeToastFn);
        toast.addEventListener('click', function(e){ if(e.target===this) closeToastFn(); });
        setTimeout(()=>{ toast.classList.add('show'); }, 1800);

        // ---- 封面 + 音乐 ----
        const cover = document.getElementById('cover');
        const audio = new Audio(MUSIC_FILE);
        audio.loop = true;
        audio.volume = 0.8;

        let isMusicPlaying = false;
        const toggleBtn = document.getElementById('audioToggle');
        const icon = toggleBtn.querySelector('.icon');

        function playMusic() {
            if (!isMusicPlaying) {
                audio.play().then(() => {
                    isMusicPlaying = true;
                    icon.textContent = '🔊';
                }).catch((err) => console.warn('自动播放失败:', err));
            }
        }

        cover.addEventListener('click', function() {
            cover.classList.add('hidden');
            playMusic();
        });

        function toggleMusic() {
            if (isMusicPlaying) {
                audio.pause();
                isMusicPlaying = false;
                icon.textContent = '🔇';
            } else {
                audio.play().then(() => {
                    isMusicPlaying = true;
                    icon.textContent = '🔊';
                }).catch((err) => {
                    alert('播放失败，请检查 ' + MUSIC_FILE + ' 文件是否存在。');
                });
            }
        }
        toggleBtn.addEventListener('click', toggleMusic);

        // ---- 视频彩蛋 ----
        const videoModal = document.getElementById('videoModal');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoControls = document.getElementById('videoControls');
        const closeVideoBtn = document.getElementById('closeVideoBtn');
        const videoBtn = document.getElementById('videoBtn');

        function renderVideoButtons() {
            videoControls.innerHTML = '';
            VIDEOS.forEach((video, index) => {
                const btn = document.createElement('button');
                btn.textContent = video.name;
                btn.dataset.index = index;
                btn.addEventListener('click', function() {
                    loadVideo(index);
                });
                videoControls.appendChild(btn);
            });
            if (VIDEOS.length > 0) {
                loadVideo(0);
            }
        }

        function loadVideo(index) {
            const video = VIDEOS[index];
            const src = video.src;
            if (src.startsWith('http://') || src.startsWith('https://')) {
                if (src.includes('bilibili.com')) {
                    const container = videoPlayer.parentNode;
                    const iframe = document.createElement('iframe');
                    iframe.src = src;
                    iframe.width = '100%';
                    iframe.height = 'auto';
                    iframe.style.aspectRatio = '16/9';
                    iframe.style.border = 'none';
                    iframe.allowFullscreen = true;
                    iframe.setAttribute('allowfullscreen', '');
                    videoPlayer.style.display = 'none';
                    container.insertBefore(iframe, videoPlayer);
                    if (videoPlayer._iframe) {
                        videoPlayer._iframe.remove();
                    }
                    videoPlayer._iframe = iframe;
                    return;
                } else {
                    videoPlayer.style.display = 'block';
                    if (videoPlayer._iframe) {
                        videoPlayer._iframe.remove();
                        delete videoPlayer._iframe;
                    }
                    videoPlayer.src = src;
                    videoPlayer.load();
                }
            } else {
                videoPlayer.style.display = 'block';
                if (videoPlayer._iframe) {
                    videoPlayer._iframe.remove();
                    delete videoPlayer._iframe;
                }
                videoPlayer.src = src;
                videoPlayer.load();
            }
        }

        videoBtn.addEventListener('click', function() {
            videoModal.classList.add('show');
            renderVideoButtons();
            if (videoPlayer.src) {
                videoPlayer.play().catch(() => {});
            }
        });

        function closeVideoModal() {
            videoModal.classList.remove('show');
            videoPlayer.pause();
            if (videoPlayer._iframe) {
                videoPlayer._iframe.remove();
                delete videoPlayer._iframe;
                videoPlayer.style.display = 'block';
                videoPlayer.src = '';
            }
        }
        closeVideoBtn.addEventListener('click', closeVideoModal);
        videoModal.addEventListener('click', function(e) {
            if (e.target === this) closeVideoModal();
        });

        console.log(`🎂 祝 ${CONFIG.friendName} ${CONFIG.age}岁生日快乐！`);
        console.log(`🎵 点击封面蛋糕进入主页面，音乐《不凡》自动响起。`);
        console.log(`🎬 点击“视频彩蛋”观看回忆视频！`);
    </script>
</body>
</html>
